name: 'Release Sandesh APK'

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.1.0)'
        required: true
        type: string
      version_code:
        description: 'Version Code (e.g. 2)'
        required: true
        type: string
      release_notes:
        description: 'Release Notes'
        required: true
        type: string
        default: 'Bug fixes and improvements'
      mandatory:
        description: 'Is this a mandatory update?'
        required: false
        type: boolean
        default: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      CI: true # So build.gradle.kts fails if signing info is missing
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Using a 3.x version as required by sdk constraint >=3.5.0 <4.0.0
          flutter-version: '3.24.0'
          cache: true

      - name: Create .env file
        run: |
          echo "${{ secrets.FLUTTER_ENV }}" > sandesh/.env
          
      - name: Set up Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > sandesh/android/sandesh-release.keystore
          
      - name: Create key.properties
        run: |
          cat > sandesh/android/key.properties << EOF
          storeFile=../sandesh-release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Flutter Pub Get
        working-directory: sandesh
        run: flutter pub get

      - name: Flutter Analyze
        working-directory: sandesh
        run: flutter analyze

      - name: Build Release APK
        working-directory: sandesh
        run: flutter build apk --release --target-platform=android-arm64 --build-name=${{ inputs.version_name }} --build-number=${{ inputs.version_code }}

      - name: Verify APK Signature
        working-directory: sandesh
        run: |
          # Use build-tools apksigner to verify it's signed (and not debug)
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          APK_PATH=build/app/outputs/flutter-apk/app-release.apk
          $BUILD_TOOLS_DIR/apksigner verify --verbose $APK_PATH
          
          # Optional: Check if it's signed with a debug key
          if $BUILD_TOOLS_DIR/apksigner verify --print-certs $APK_PATH | grep -i "CN=Android Debug"; then
            echo "Error: APK is signed with a debug key!"
            exit 1
          fi

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        working-directory: sandesh
        run: |
          APK_PATH=build/app/outputs/flutter-apk/app-release.apk
          NEW_APK_NAME=sandesh-arm64.apk
          
          # Rename APK
          cp $APK_PATH $NEW_APK_NAME
          
          # Calculate SHA-256
          SHA256=$(sha256sum $NEW_APK_NAME | cut -d ' ' -f 1)
          
          # Create update.json
          cat > update.json << EOF
          {
            "packageName": "com.example.sandesh",
            "versionCode": ${{ inputs.version_code }},
            "versionName": "${{ inputs.version_name }}",
            "apkAsset": "$NEW_APK_NAME",
            "sha256": "$SHA256",
            "mandatory": ${{ inputs.mandatory }},
            "releaseNotes": "${{ inputs.release_notes }}"
          }
          EOF
          
          echo "SHA256=$SHA256" >> $GITHUB_OUTPUT

      - name: Create GitHub Release in Sandesh-Releases
        # Note: GITHUB_TOKEN won't work for cross-repo publishing.
        # We need a secret `RELEASE_PAT` (fine-grained PAT with Contents: write on Sandesh-Releases).
        uses: softprops/action-gh-release@v2
        with:
          repository: Codewith-AG/Sandesh-Releases
          token: ${{ secrets.RELEASE_PAT }}
          tag_name: v${{ inputs.version_name }}+${{ inputs.version_code }}
          name: Sandesh v${{ inputs.version_name }}
          body: ${{ inputs.release_notes }}
          files: |
            sandesh/sandesh-arm64.apk
            sandesh/update.json
          draft: false
          prerelease: false

      - name: Cleanup Secrets
        if: always()
        run: |
          rm -f sandesh/.env
          rm -f sandesh/android/sandesh-release.keystore
          rm -f sandesh/android/key.properties
