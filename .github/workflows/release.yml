name: 'Release Sandesh APK'

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release Notes'
        required: true
        type: string
        default: 'Bug fixes and improvements'
      mandatory:
        description: 'Is this a mandatory update?'
        required: false
        type: boolean
        default: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      CI: true # So build.gradle.kts fails if signing info is missing
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Extract Version from pubspec.yaml
        id: extract_version
        working-directory: sandesh
        run: |
          VERSION_STRING=$(grep '^version: ' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=$(echo $VERSION_STRING | cut -d'+' -f1)
          VERSION_CODE=$(echo $VERSION_STRING | cut -d'+' -f2)
          
          echo "Extracted Version: $VERSION_NAME+$VERSION_CODE"
          
          if [[ -z "$VERSION_NAME" || -z "$VERSION_CODE" ]]; then
            echo "Error: Could not extract valid version from pubspec.yaml"
            exit 1
          fi
          
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Verify Version Code strictly increasing
        run: |
          HTTP_STATUS=$(curl -sL -w "%{http_code}" -o update.json https://github.com/Codewith-AG/Sandesh-Releases/releases/latest/download/update.json || echo "curl_failed")
          
          if [ "$HTTP_STATUS" = "200" ]; then
            REMOTE_VERSION_CODE=$(grep -o '"versionCode"[[:space:]]*:[[:space:]]*[0-9]*' update.json | grep -o '[0-9]*')
            echo "Remote Version Code: $REMOTE_VERSION_CODE"
            echo "Local Version Code: ${{ env.VERSION_CODE }}"
            
            if [ "${{ env.VERSION_CODE }}" -le "$REMOTE_VERSION_CODE" ]; then
              echo "Error: Local versionCode (${{ env.VERSION_CODE }}) must be strictly greater than remote ($REMOTE_VERSION_CODE)"
              exit 1
            fi
          elif [ "$HTTP_STATUS" = "404" ]; then
            echo "No previous release found (404). Proceeding as first release."
          else
            echo "Error: Could not fetch update.json. HTTP Status: $HTTP_STATUS. Failing closed."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK 36 and NDK 27
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install \
            "platforms;android-36" \
            "ndk;27.3.13750724" \
            "build-tools;34.0.0" 2>/dev/null || true
          echo "Installed SDK components:"
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --list_installed 2>/dev/null | \
            grep -E 'android-36|ndk;27|build-tools' || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env file
        run: |
          echo "${{ secrets.FLUTTER_ENV }}" > sandesh/.env

      - name: Set up Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > sandesh/android/sandesh-release.keystore

      - name: Create key.properties
        run: |
          cat > sandesh/android/key.properties << EOF
          storeFile=../sandesh-release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Flutter Pub Get
        working-directory: sandesh
        run: flutter pub get

      - name: Flutter Analyze
        working-directory: sandesh
        run: flutter analyze

      - name: Flutter Test
        working-directory: sandesh
        run: flutter test

      - name: Build Release APK
        working-directory: sandesh
        run: flutter build apk --release --target-platform=android-arm64 --build-name=${{ env.VERSION_NAME }} --build-number=${{ env.VERSION_CODE }} --dart-define-from-file=.env --split-debug-info=build/symbols --obfuscate

      - name: Verify APK Signature
        working-directory: sandesh
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          APK_PATH=build/app/outputs/flutter-apk/app-release.apk
          $BUILD_TOOLS_DIR/apksigner verify --verbose $APK_PATH
          
          if $BUILD_TOOLS_DIR/apksigner verify --print-certs $APK_PATH | grep -i "CN=Android Debug"; then
            echo "Error: APK is signed with a debug key!"
            exit 1
          fi

      - name: Prepare Release Artifacts
        working-directory: sandesh
        run: |
          APK_PATH=build/app/outputs/flutter-apk/app-release.apk
          NEW_APK_NAME=sandesh-arm64.apk
          
          cp $APK_PATH $NEW_APK_NAME
          SHA256=$(sha256sum $NEW_APK_NAME | cut -d ' ' -f 1)
          
          cat > update.json << EOF
          {
            "packageName": "com.example.sandesh",
            "versionCode": ${{ env.VERSION_CODE }},
            "versionName": "${{ env.VERSION_NAME }}",
            "apkAsset": "$NEW_APK_NAME",
            "sha256": "$SHA256",
            "mandatory": ${{ inputs.mandatory }},
            "releaseNotes": "${{ inputs.release_notes }}"
          }
          EOF

      - name: Create GitHub Release in Sandesh-Releases
        uses: softprops/action-gh-release@v2
        with:
          repository: Codewith-AG/Sandesh-Releases
          token: ${{ secrets.RELEASE_PAT }}
          tag_name: v${{ env.VERSION_NAME }}+${{ env.VERSION_CODE }}
          name: Sandesh v${{ env.VERSION_NAME }}
          body: ${{ inputs.release_notes }}
          files: |
            sandesh/sandesh-arm64.apk
            sandesh/update.json
          draft: false
          prerelease: false

      - name: Cleanup Secrets
        if: always()
        run: |
          rm -f sandesh/.env
          rm -f sandesh/android/sandesh-release.keystore
          rm -f sandesh/android/key.properties
