<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Conversation - Modern Pop</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>

            },

                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}]
            }
          }
        }
      }
    </script>
<style>
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e3e1ed; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #cbc3d7; 
        }
        
        /* Subtle animated background gradient */
        .bg-animated-gradient {
            background: radial-gradient(circle at top left, #ffffff 0%, #f4f2fe 50%, #e9ddff 100%);
            background-size: 200% 200%;
            animation: gradientMove 15s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-animated-gradient font-body-md text-on-surface h-screen flex flex-col overflow-hidden antialiased">
<!-- Chat Header (Task-focused TopAppBar variation) -->
<header class="flex justify-between items-center px-margin-mobile md:px-margin-desktop h-[72px] w-full shrink-0 z-50 bg-surface-container-lowest/80 backdrop-blur-xl border-b border-surface-variant/20 shadow-[0px_4px_20px_rgba(139,92,246,0.08)]">
<div class="flex items-center gap-3">
<button aria-label="Go back" class="p-2 -ml-2 rounded-full hover:bg-surface-container transition-colors text-primary">
<span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span>
</button>
<div class="relative cursor-pointer hover:opacity-90 transition-opacity">
<img alt="Profile picture of Maya" class="w-[44px] h-[44px] rounded-[18px] object-cover shadow-sm" data-alt="A vibrant, modern portrait of a young woman with a warm, energetic smile, illuminated by soft, high-key studio lighting. The background is a clean, bright, and slightly blurred pastel environment that complements the light-mode UI aesthetic. The overall mood is friendly, approachable, and highly contemporary, fitting seamlessly into a colorful social application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBVvhutjdmB6xrLjegsf7Nu2BozzGWylhjP5fpgJ6sMoNZv-DCMdMubhUobr-PUgGpsfIQbXys7Sble3JcW9PWZfwGDqnPxUrRcfBJsby0_vdlHMiZ8NCo65kUPRuBtzyjpgvUEPBdsBZS4cpW8DFn5AvIJz9eEC2BHL86jHgT-y0U4JstXvedvkgOC68ulh98CsRYdKLAJVBEPagR1C879KT06EgzQJq31wBBTx5RgU-9pF2t5_L_k8QNueMchbiybe3Qn0fKhtnE"/>
<div class="absolute -bottom-1 -right-1 w-4 h-4 bg-secondary-fixed-dim rounded-full border-[2.5px] border-surface-container-lowest shadow-sm"></div>
</div>
<div class="flex flex-col justify-center">
<span class="font-headline-md text-headline-md text-on-surface tracking-tight leading-none mb-1">Maya</span>
<span class="font-label-sm text-label-sm text-primary flex items-center gap-1">
<span class="w-1.5 h-1.5 bg-primary rounded-full animate-pulse"></span>
                    Typing...
                </span>
</div>
</div>
<div class="flex items-center gap-1">
<button aria-label="Audio Call" class="p-2.5 rounded-[14px] hover:bg-surface-container transition-colors text-primary flex items-center justify-center">
<span class="material-symbols-outlined text-[26px]">call</span>
</button>
<button aria-label="Video Call" class="p-2.5 rounded-[14px] bg-primary/5 hover:bg-primary/10 transition-colors text-primary flex items-center justify-center">
<span class="material-symbols-outlined text-[26px]">videocam</span>
</button>
</div>
</header>
<!-- Message Canvas -->
<main class="flex-1 overflow-y-auto p-margin-mobile md:px-[15%] lg:px-[25%] flex flex-col gap-sm pb-8">
<!-- Timestamp -->
<div class="flex justify-center my-4">
<span class="font-label-sm text-label-sm text-outline-variant bg-surface-container-lowest/50 backdrop-blur-md px-3 py-1 rounded-full shadow-sm">
                Today, 2:45 PM
            </span>
</div>
<!-- Receiver Text Bubble -->
<div class="flex items-end gap-2 max-w-[85%] sm:max-w-[75%] self-start group">
<img alt="Maya avatar" class="w-[32px] h-[32px] rounded-[12px] mb-1 shrink-0 object-cover shadow-sm opacity-100 transition-opacity" data-alt="A vibrant, modern portrait of a young woman with a warm, energetic smile, illuminated by soft, high-key studio lighting. The background is a clean, bright, and slightly blurred pastel environment that complements the light-mode UI aesthetic. The overall mood is friendly, approachable, and highly contemporary, fitting seamlessly into a colorful social application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD7SZ0GuqPoi5o42WWyVp72SUVs9xVHVWirktI49GHRa_7DhUASjA_UN16gWPhKrWkv6PHwuzM1rzIKUk4sNtR9ZIgVPTYoUefhdQAOydL5h6okPAQN-zwMxAv6MgecKCLeWMsDK3GYvyFSPzbNJtEqjwud-IJywWCd7hYbslehQ8zuPYFPBx3ofqqJ54CoqDwjVSD5pdJd9TqjB2jB6UybO1-e3MotK28trohLfh88qoXUzSt4xR_tBklTOy8J1TQu3GzURDYtNzA"/>
<div class="bg-surface-container-lowest text-on-surface px-4 py-3 rounded-[24px] rounded-bl-[8px] shadow-[0px_4px_16px_rgba(139,92,246,0.06)] font-body-md leading-relaxed border border-surface-variant/50 relative">
                Hey! Are we still on for the neon roller rink tonight? 🛼 I found this crazy jacket I want to wear.
            </div>
</div>
<!-- Sender Text Bubble -->
<div class="flex items-end gap-2 max-w-[85%] sm:max-w-[75%] self-end">
<div class="bg-primary text-on-primary px-4 py-3 rounded-[24px] rounded-br-[8px] shadow-[0px_8px_20px_rgba(107,56,212,0.15)] font-body-md leading-relaxed relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-white/10 to-transparent pointer-events-none"></div>
                Absolutely! I already got my retro outfit ready. It's going to be epic. ✨
            </div>
</div>
<!-- Receiver Image Message -->
<div class="flex items-end gap-2 max-w-[85%] sm:max-w-[75%] self-start mt-2">
<div class="w-[32px] h-[32px] shrink-0 mb-1"></div> <!-- Spacer for alignment when avatar isn't needed -->
<div class="bg-surface-container-lowest p-[6px] rounded-[24px] rounded-bl-[8px] shadow-[0px_4px_16px_rgba(139,92,246,0.06)] border border-surface-variant/50 max-w-[280px]">
<img alt="Roller skates" class="rounded-[18px] w-full h-[200px] object-cover mb-2" data-alt="A brightly colored pair of vintage-style quad roller skates, featuring neon pink and electric yellow accents against a smooth white boot. The skates are set against a subtle, pastel lavender background with soft, dynamic lighting that casts a playful drop shadow. The overall aesthetic is energetic, retro-modern pop, perfectly matching a lively and youthful UI design." src="https://lh3.googleusercontent.com/aida-public/AB6AXuApdb1fDBt73W1IzdsLEqnYrclyqELH3EyGnRqy5Vn5HvAM8DYtW11MxGA2oyKDJEugwt4uRvB7MK1qseZeMfQP2PvjJqCgRIY_MEJU7hqfZW0wChL4arv-VSO1hvcwT_lsNc2w0DSerF_Ks_XhU_2fFzvbnlAmwPzoo7u7wxoY5Xzsee3EDh0DMDb41S9MQw1UAwHbRZ5Mnu_dSEk2v5uRxRoq5mysAIPXypBMAteq1etVwa8Za1ZiE2D2ZeoyOh3I0wq5Klq4hcY"/>
<p class="px-3 pb-2 pt-1 font-body-md text-on-surface">Can't decide which wheels to put on these bad boys though.</p>
</div>
</div>
<!-- Sender Voice Note Bubble -->
<div class="flex items-end gap-2 max-w-[85%] sm:max-w-[75%] self-end mt-2">
<div class="bg-primary text-on-primary p-2 pr-4 rounded-[24px] rounded-br-[8px] shadow-[0px_8px_20px_rgba(107,56,212,0.15)] flex items-center gap-3 min-w-[240px] relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-bl from-white/5 to-transparent pointer-events-none"></div>
<button aria-label="Play voice note" class="w-[44px] h-[44px] rounded-[18px] bg-secondary-fixed-dim text-on-secondary-fixed flex items-center justify-center shrink-0 shadow-md hover:scale-105 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
<!-- Stylized Waveform -->
<div class="flex-1 flex items-center justify-between gap-[3px] h-[32px] px-1">
<div class="w-[3px] bg-on-primary/60 h-[30%] rounded-full"></div>
<div class="w-[3px] bg-on-primary/90 h-[70%] rounded-full"></div>
<div class="w-[3px] bg-white h-[100%] rounded-full shadow-[0_0_8px_rgba(255,255,255,0.8)]"></div>
<div class="w-[3px] bg-white h-[60%] rounded-full"></div>
<div class="w-[3px] bg-on-primary/80 h-[80%] rounded-full"></div>
<div class="w-[3px] bg-on-primary/50 h-[40%] rounded-full"></div>
<div class="w-[3px] bg-on-primary/30 h-[20%] rounded-full"></div>
<div class="w-[3px] bg-on-primary/30 h-[30%] rounded-full"></div>
<div class="w-[3px] bg-on-primary/30 h-[10%] rounded-full"></div>
</div>
<span class="font-label-md text-on-primary/90 text-label-md tracking-wider">0:12</span>
</div>
</div>
<!-- Reaction Indicator (attached to previous message) -->
<div class="flex justify-end pr-8 -mt-3 relative z-10">
<div class="bg-surface-container-lowest border border-surface-variant/30 rounded-full px-2 py-1 flex items-center gap-1 shadow-[0px_4px_12px_rgba(139,92,246,0.1)]">
<span class="text-sm">🔥</span>
<span class="text-sm">✨</span>
</div>
</div>
</main>
<!-- Chat Input Area -->
<footer class="bg-surface-container-lowest/90 backdrop-blur-2xl border-t border-surface-variant/20 shrink-0 shadow-[0px_-8px_32px_rgba(139,92,246,0.06)] pb-safe relative z-50">
<div class="px-margin-mobile md:px-margin-desktop py-4 flex items-end gap-3 md:max-w-3xl md:mx-auto w-full">
<button aria-label="Add attachment" class="w-[44px] h-[44px] bg-surface-container hover:bg-surface-container-highest text-primary rounded-full transition-colors shrink-0 flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">add</span>
</button>
<div class="flex-1 bg-surface-container-low border border-transparent focus-within:border-primary/30 rounded-[24px] min-h-[48px] flex items-center px-2 py-1 transition-all shadow-inner relative">
<textarea class="w-full bg-transparent border-none focus:ring-0 resize-none max-h-[120px] py-2.5 px-3 font-body-md text-on-surface placeholder-outline m-0" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'" placeholder="Message Maya..." rows="1"></textarea>
<button aria-label="Choose emoji" class="w-[36px] h-[36px] rounded-full text-outline hover:text-secondary-fixed-dim hover:bg-surface-container-lowest shrink-0 flex items-center justify-center transition-colors ml-1">
<span class="material-symbols-outlined text-[22px]">mood</span>
</button>
</div>
<button aria-label="Record voice note" class="w-[48px] h-[48px] bg-primary text-on-primary rounded-[20px] shrink-0 flex items-center justify-center shadow-[0px_6px_16px_rgba(107,56,212,0.25)] hover:scale-105 hover:-translate-y-0.5 active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
</footer>
<script>
        // Simple script to auto-scroll to bottom on load to simulate active chat
        window.onload = function() {
            const main = document.querySelector('main');
            main.scrollTop = main.scrollHeight;
        };
    </script>
</body></html>
